<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير المربط الاحترافي</title>
    <style>
        :root { --primary: #2e7d32; --dark: #1b5e20; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); margin: 0; padding: 15px; }
        .wrapper { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        
        /* لوحة التحكم والخدمات */
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        
        .service-item { 
            background: white; border: 2px solid #ddd; padding: 15px; border-radius: 12px;
            text-align: center; cursor: pointer; position: relative;
        }
        .service-item:hover { border-color: var(--primary); background: #f0fff0; }
        .service-item b { display: block; font-size: 16px; color: var(--dark); }
        .service-item span { color: #666; font-size: 14px; }

        /* أزرار التحكم */
        .admin-controls { margin-bottom: 20px; padding: 10px; border-bottom: 2px dashed #ccc; display: none; }
        .btn-admin { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .delete-btn { position: absolute; top: -5px; left: -5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; border: none; cursor: pointer; }

        /* الجانب المالي */
        .sidebar { background: var(--primary); color: white; padding: 20px; border-radius: 15px; height: fit-content; }
        .total-box { font-size: 35px; font-weight: bold; text-align: center; margin: 20px 0; background: rgba(0,0,0,0.1); padding: 10px; border-radius: 8px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; color: #333; }
        
        .action-btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        @media (max-width: 850px) { .wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="color: var(--primary);">خدمات المربط</h2>
            <button class="btn-admin" onclick="toggleAdmin()">⚙️ لوحة التحكم</button>
        </div>

        <div id="adminPanel" class="admin-controls">
            <h4>إضافة خدمة جديدة:</h4>
            <input type="text" id="newServiceName" placeholder="اسم الخدمة (مثلاً: إيواء)">
            <input type="number" id="newServicePrice" placeholder="السعر">
            <button onclick="addNewService()" style="background: var(--primary); color: white; border: none; padding: 5px 15px; cursor: pointer;">إضافة +</button>
        </div>

        <div id="servicesGrid" class="grid"></div>

        <h3>سجل المبيعات اليومية</h3>
        <table>
            <thead>
                <tr>
                    <th>الخدمة</th>
                    <th>السعر</th>
                    <th>الوقت</th>
                </tr>
            </thead>
            <tbody id="salesLog"></tbody>
        </table>
    </div>

    <div class="sidebar">
        <h3>الملخص المالي</h3>
        <div class="total-box" id="displayTotal">0 ريال</div>
        <button class="action-btn" onclick="window.print()">🖨 طباعة التقرير</button>
        <button class="action-btn" style="background:#ff5252; color:white;" onclick="resetDay()">♻ تصفير اليومية</button>
    </div>
</div>

<script>
    // البيانات الافتراضية
    let services = JSON.parse(localStorage.getItem('myServices')) || [
        { name: "ربع ساعة", price: 20 },
        { name: "نصف ساعة", price: 40 },
        { name: "ساعة كاملة", price: 70 }
    ];

    let dailyTotal = 0;
    let isAdmin = false;

    function renderServices() {
        const grid = document.getElementById('servicesGrid');
        grid.innerHTML = '';
        services.forEach((s, index) => {
            const div = document.createElement('div');
            div.className = 'service-item';
            div.innerHTML = `
                ${isAdmin ? `<button class="delete-btn" onclick="deleteService(${index}, event)">×</button>` : ''}
                <b>${s.name}</b>
                <span>${s.price} ريال</span>
            `;
            div.onclick = () => !isAdmin && addSale(s.name, s.price);
            grid.appendChild(div);
        });
        localStorage.setItem('myServices', JSON.stringify(services));
    }

    function toggleAdmin() {
        isAdmin = !isAdmin;
        document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
        renderServices();
    }

    function addNewService() {
        const name = document.getElementById('newServiceName').value;
        const price = document.getElementById('newServicePrice').value;
        if(name && price) {
            services.push({ name: name, price: parseInt(price) });
            renderServices();
            document.getElementById('newServiceName').value = '';
            document.getElementById('newServicePrice').value = '';
        }
    }

    function deleteService(index, event) {
        event.stopPropagation();
        services.splice(index, 1);
        renderServices();
    }

    function addSale(name, price) {
        const log = document.getElementById('salesLog');
        const row = log.insertRow(0);
        const now = new Date();
        row.innerHTML = `<td>${name}</td><td>${price} ريال</td><td>${now.getHours()}:${now.getMinutes()}</td>`;
        
        dailyTotal += price;
        document.getElementById('displayTotal').innerText = dailyTotal + " ريال";
    }

    function resetDay() {
        if(confirm("هل تريد تصفير مبيعات اليوم؟")) {
            document.getElementById('salesLog').innerHTML = '';
            dailyTotal = 0;
            document.getElementById('displayTotal').innerText = "0 ريال";
        }
    }

    // التشغيل الأول
    renderServices();
</script>

</body>
</html>
