<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام كاشير المربط المطور</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f8faf9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .wrapper { max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1fr 320px; gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* لوحة التحكم */
        .admin-panel { background: #f1f1f1; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px dashed var(--primary); }
        .admin-panel input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; width: 120px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .btn-service { 
            background: white; border: 2px solid var(--primary); padding: 15px 5px; border-radius: 10px;
            cursor: pointer; text-align: center; font-weight: bold; position: relative;
        }
        .btn-service:hover { background: #e8f5e9; }
        .btn-service .price { display: block; font-size: 12px; color: #666; font-weight: normal; }
        .del-item { position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: none; }

        .sidebar { background: var(--primary); color: white; padding: 20px; border-radius: 12px; height: fit-content; text-align: center; }
        .total-box { font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin: 15px 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; font-size: 13px; color: #333; }
        
        .btn-action { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        
        @media (max-width: 800px) { .wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--primary); margin:0;">كاشير المربط</h2>
            <button onclick="toggleAdminMode()" id="adminBtn" style="background:#444; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">⚙️ لوحة التحكم</button>
        </div>

        <div id="adminArea" class="admin-panel" style="display:none;">
            <h4>إضافة خدمة جديدة للجميع:</h4>
            <input type="text" id="newItemName" placeholder="اسم الخدمة">
            <input type="number" id="newItemPrice" placeholder="السعر">
            <button onclick="addItem()" style="background:var(--primary); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">إضافة +</button>
