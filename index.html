<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المربط المتكامل - كاشير وإدارة</title>
    <style>
        :root { --p-color: #2e7d32; --s-color: #1b5e20; --bg: #f0f4f2; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* الهيكل الرئيسي */
        .main-wrapper { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        
        /* الترويسة */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: var(--p-color); margin: 0; font-size: 24px; }

        /* لوحة التحكم (إضافة خدمات) */
        .admin-section { background: #e8f5e9; border: 2px dashed var(--p-color); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .admin-section input { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; width: 140px; }
        
        /* شبكة الأزرار */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .service-btn { 
            background: var(--white); border: 2px solid var(--p-color); padding: 20px 10px; border-radius: 12px; 
            text-align: center; cursor: pointer; transition: 0.2s; position: relative; font-weight: bold;
        }
        .service-btn:hover { background: var(--p-color); color: white; transform: translateY(-3px); }
        .service-btn span { display: block; font-size: 13px; margin-top: 5px; opacity: 0.8; }
        .del-badge { position: absolute; top: -10px; left: -10px; background: #d32f2f; color: white; border-radius: 50%; width: 25px; height: 25px; border: none; cursor: pointer; display: none; }

        /* سجل المبيعات */
        .table-container { margin-top: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        th { background: #f8f9fa; color: var(--p-color); }

        /* الجانب المالي والتقارير */
        .sidebar { background: var(--p-color); color: white; padding: 25px; border-radius: 15px; height: fit-content; position: sticky; top: 10px; }
        .stats-card { background: rgba(0,0,0,0.15); padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .stats-card h3 { margin: 0; font-size: 16px; opacity: 0.9; }
        .stats-card .total { font-size: 36px; font-weight: bold; margin: 10px 0; }
