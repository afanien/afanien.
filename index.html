<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام كاشير المربط - نسخة متكاملة</title>
    <style>
        :root { --primary: #2e7d32; --dark: #1b5e20; --bg: #f4f7f6; --white: #ffffff; --danger: #d32f2f; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .wrapper { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* الترويسة */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 24px; }

        /* لوحة التحكم (إضافة المنتجات) */
        .admin-panel { background: #e8f5e9; border: 2px dashed var(--primary); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .admin-panel input { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; width: 150px; }
        
        /* شبكة أزرار البيع */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .item-btn { 
            background: var(--white); border: 2px solid var(--primary); padding: 20px 10px; border-radius: 12px; 
            text-align: center; cursor: pointer; transition: 0.2s; position: relative; font-weight: bold;
        }
        .item-btn:active { background: var(--primary); color: white; transform: scale(0.95); }
        .item-btn span { display: block; font-size: 13px; color: #666; font-weight: normal; margin-top: 5px; }
        .item-btn:hover span { color: inherit; }
        .del-item { position: absolute; top: -10px; left: -10px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: none; font-size: 14px; }

        /* الجانب المالي والتقارير */
        .sidebar { background: var(--primary); color: white; padding: 25px; border-radius: 15px; height: fit-content; position: sticky; top: 10px; }
