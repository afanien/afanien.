<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير المربط المحلي</title>
    <style>
        :root { --primary: #2e7d32; --dark: #1b5e20; --light: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); margin: 0; padding: 10px; }
        .wrapper { max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1fr 320px; gap: 15px; }
        .card { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* الهيدر */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        h1 { color: var(--primary); margin: 0; font-size: 22px; }

        /* لوحة التحكم */
        .admin-box { background: #e8f5e9; border: 1px dashed var(--primary); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .admin-box input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; width: 120px; }

        /* الأزرار */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .service-item { 
            background: var(--white); border: 2px solid var(--primary); padding: 15px 5px; border-radius: 10px;
            text-align: center; cursor: pointer; transition: 0.2s; position: relative; font-weight: bold;
        }
        .service-item:active { background: var(--primary); color: white; transform: scale(0.95); }
        .service-item span { display: block; font-size: 12px; color: #666; font-weight: normal; margin-top: 4px; }
        .del-btn { position: absolute; top: -8px; right: -8px; background: #d32f2f; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: none; }

        /* الجانب المالي */
        .sidebar { background: var(--primary); color: white; padding: 20px; border-radius: 12px; height: fit-content; }
        .total-box { font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.15); padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center; }
        
        /* الجدول */
        .table-area { margin-top: 25px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        th { background: #f1f1f1; color: var(--primary); }

        .btn { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
        .btn-reset { background: #ff5252; color: white; margin-top: 20px; }
        
        @media (max-width: 800px) { .wrapper { grid-template-columns: 1fr; } }
        @media print { .admin-box, .btn, #adminToggle, .del-btn { display: none !important; } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div class="header">
            <h1>كاشير المربط (نظام محلي)</h1>
            <button onclick="toggleAdmin()" id="adminToggle" style="background:#444; color:white; border:none; padding:6px 12px; border-radius:5px; cursor:pointer;">⚙️ الإدارة</button>
        </div>

        <div id="adminPanel" class="admin-box">
            <h4 style="margin:0 0 10px 0;">إضافة خدمة/منتج جديد:</h4>
            <input type="text" id="itemName" placeholder="الخدمة">
            <input type="number" id="itemPrice" placeholder="السعر">
            <button onclick="addItem()" style="background:var(--primary); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">إضافة +</button>
        </div>

        <div id="menuGrid" class="grid"></div>

        <div class="table-area">
            <h3>سجل العمليات اليومي</h3>
            <table>
                <thead>
                    <tr><th>الخدمة</th><th>السعر</th><th>الوقت</th></tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </div>

    <div class="sidebar">
        <h3>تقرير اليوم</h3>
        <div class="total-box" id="totalDisplay">0 ريال</div>
        <button class="btn" style="background:white; color:var(--primary);" onclick="window.print()">🖨 طباعة التقرير</button>
        <button class="btn btn-reset" onclick="clearDailySales()">♻ تصفير المبيعات</button>
        <p style="font-size:10px; margin-top:15px; opacity:0.8; text-align:center;">* البيانات تُحفظ في ذاكرة هذا المتصفح فقط.</p>
    </div>
</div>

<script>
    // تحميل البيانات المحفوظة أو وضع بيانات افتراضية
    let services = JSON.parse(localStorage.getItem('m_services')) || [
        {name: "ربع ساعة", price: 20},
        {name: "نصف ساعة", price: 40},
        {name: "ساعة كاملة", price: 70}
    ];
    let sales = JSON.parse(localStorage.getItem('m_sales')) || [];
    let total = parseInt(localStorage.getItem('m_total')) || 0;
    let isAdmin = false;

    function render() {
        // تحديث شبكة الأزرار
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';
        services.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = 'service-item';
            div.innerHTML = `
                <button class="del-btn" onclick="deleteItem(${i}, event)" style="display:${isAdmin?'block':'none'}">×</button>
                ${s.name} <span>${s.price} ريال</span>
            `;
            div.onclick = () => { if(!isAdmin) addSale(s.name, s.price); };
            grid.appendChild(div);
        });

        // تحديث جدول المبيعات
        const table = document.getElementById('logBody');
        table.innerHTML = '';
        sales.forEach(sale => {
            const row = table.insertRow();
            row.innerHTML = `<td>${sale.name}</td><td>${sale.price} ريال</td><td>${sale.time}</td>`;
        });

        document.getElementById('totalDisplay').innerText = total + " ريال";
        
        // حفظ في الذاكرة المحلية
        localStorage.setItem('m_services', JSON.stringify(services));
        localStorage.setItem('m_sales', JSON.stringify(sales));
        localStorage.setItem('m_total', total);
    }

    function addSale(name, price) {
        const time = new Date().toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
        sales.unshift({name, price, time});
        total += price;
        render();
    }

    function addItem() {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        if(name && price) {
            services.push({name, price: parseInt(price)});
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            render();
        }
    }

    function deleteItem(index, e) {
        e.stopPropagation();
        services.splice(index, 1);
        render();
    }

    function toggleAdmin() {
        isAdmin = !isAdmin;
        document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('adminToggle').innerText = isAdmin ? "✅ حفظ" : "⚙️ الإدارة";
        render();
    }

    function clearDailySales() {
        if(confirm("هل تريد مسح مبيعات اليوم وتصفير الإجمالي؟")) {
            sales = [];
            total = 0;
            render();
        }
    }

    // التشغيل الأول
    render();
</script>

</body>
</html>
